<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'love';
            src: url('love larry ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*tipos de format()
            -opentype (otf)
            -truetype(ttf)
            -enbedde-opentype
            -truetype-aat (apple advance typography)
            -svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        h1{
            font-family: 'love', times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>olá, mundo!</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptas dolorem harum assumenda accusamus exercitationem possimus, necessitatibus veritatis sunt laboriosam cum nihil minus eos ea explicabo voluptates voluptatibus! Sapiente, illo nobis!</p>
</body>
</html>
