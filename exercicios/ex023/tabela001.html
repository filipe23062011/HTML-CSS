<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="filipe.ico" type="image/x-icon">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            /* border: 5px solid red; */
        }

        /* tr.linha {
            background-color: gray;
        } */

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;/*Alinhamento Horizontal*/
            vertical-align: middle;/*Alinhamento Vertical*/

            
        }

        .numero{
            text-align: right;
        }

        /* td.dado{
            background-color: yellow;
        } */
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <table>
        <!--
            HIERARQUIA DE TABELAS (simples)  
            TABLE = tabela 
            TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
        -->
<tr><!--TABLE ROW-->
    <!--primeira linha-->
    <td><!--TABLE DATA-->A1</td>
    <td>B1</td>
    <td>C1</td>
</tr>
<tr><!-- segunda linha -->
     <!-- class="linha" -->
    <td>A2</td>
    <td>B2</td>
    <td class="numero">C2</td>
</tr>
<tr><!--terceira linha -->
    <td>A3</td>
    <td>B3</td>
    <td class="numero">C3</td>
</tr>
<tr><!--quarta linha -->
    <td>A4</td>
    <td>B4</td> 
    <!-- class="dado" -->
    <td>C4</td>
</tr>
<!-- <tr>
    <td>A5</td>
    <td>B5</td>
</tr>
<tr>
    <td>A6</td>
</tr> -->
    </table>
    <!--dentro do TABLE tem TR e dentro do TR tem TD-->
</body>
</html>
